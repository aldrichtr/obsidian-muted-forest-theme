<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TA Theme Palette</title>

    <link rel="stylesheet" href="foundations.css" />

    <style>
      body {
        margin: 0;
        padding: 1rem;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin-bottom: 1rem;
        font-size: 1.4rem;
      }

      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .swatch {
        width: 3in;
        height: 3in;
        border-radius: 0.4rem;
        border: 1px solid rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0.6rem 0.8rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
        font-size: 0.85rem;
        line-height: 1.4;
        transition: color 0.2s ease;
      }

      .swatch-name {
        font-weight: 600;
      }

      .swatch-var,
      .swatch-rgb {
        opacity: 0.9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>

  <body>
    <h1>TA Theme Color Palette</h1>
    <div class="grid" id="palette"></div>

    <script>
      // Convert hex → rgb object
      function hexToRgbObj(hex) {
        const clean = hex.replace("#", "");
        const bigint = parseInt(clean, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255,
        };
      }

      // Convert hex → rgb string
      function hexToRgbString(hex) {
        const { r, g, b } = hexToRgbObj(hex);
        return `rgb(${r}, ${g}, ${b})`;
      }

      // WCAG luminance formula
      function luminance({ r, g, b }) {
        const a = [r, g, b].map((v) => {
          v /= 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
      }

      // Choose text color based on luminance
      function bestTextColor(hex) {
        const rgb = hexToRgbObj(hex);
        const lum = luminance(rgb);
        return lum > 0.55 ? "#1e1e19" : "#F6F0E6"; // dark text for light colors
      }

      // Convert variable name → readable label
      function varToLabel(v) {
        return v
          .replace("--ta-", "")
          .replace(/-/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      // Extract all CSS variables from :root
      function getThemeVariables() {
        const styles = getComputedStyle(document.documentElement);
        const vars = [];

        for (let i = 0; i < styles.length; i++) {
          const name = styles[i];
          if (name.startsWith("--ta-")) {
            const value = styles.getPropertyValue(name).trim();
            vars.push({ name, value });
          }
        }
        return vars;
      }

      function buildSwatches() {
        const palette = document.getElementById("palette");
        const vars = getThemeVariables().sort((a, b) => a.name.localeCompare(b.name));

        vars.forEach((v) => {
          const rgb = hexToRgbString(v.value);
          const label = varToLabel(v.name);
          const textColor = bestTextColor(v.value);

          const swatch = document.createElement("div");
          swatch.className = "swatch";
          swatch.style.background = v.value;
          swatch.style.color = textColor;

          swatch.innerHTML = `
          <div class="swatch-name">${label}</div>
          <div class="swatch-var">${v.name}</div>
          <div class="swatch-rgb">${rgb} / ${v.value}</div>
        `;

          palette.appendChild(swatch);
        });
      }

      buildSwatches();
    </script>
  </body>
</html>
